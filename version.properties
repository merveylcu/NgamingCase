# App versioning — single source of truth.
#
# versionCode : Integer. Increment for every Play Store submission. Never decrement.
# versionName : Semantic version (MAJOR.MINOR.PATCH).
#
# CI release builds read these values automatically.
# To release: bump VERSION_CODE, update VERSION_NAME, commit, tag with vX.Y.Z.
VERSION_CODE=1
VERSION_NAME=1.0.0

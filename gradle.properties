# =============================================================================
# Gradle Build Properties -- NgamingCase
# https://docs.gradle.org/current/userguide/build_environment.html
#
# IDE NOTE: Settings configured through Android Studio will override this file.
# =============================================================================


# =============================================================================
# JVM
# =============================================================================

# 4 GB heap with G1GC for predictable pause times during large builds.
# Metaspace capped at 1.5 GB to reduce daemon restarts on large multi-module builds.
# HeapDump written on OOM for post-mortem diagnosis.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1536m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=build/heap-dump.hprof -Dfile.encoding=UTF-8

# Kotlin daemon heap -- separate from the Gradle daemon heap.
# Increase if Kotlin compilation runs out of memory on large modules.
kotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=768m


# =============================================================================
# Performance
# =============================================================================

# Execute independent subproject tasks concurrently.
org.gradle.parallel=true

# Reuse task outputs from previous builds when inputs have not changed.
org.gradle.caching=true

# Serialize the configuration phase once and reuse across subsequent builds.
# Verify plugin compatibility before enabling in existing projects.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true

# Keep the Gradle daemon alive between builds (critical for IDE responsiveness).
org.gradle.daemon=true

# VFS watch: Gradle monitors the file system between builds for faster
# incremental task up-to-date checks. Enabled by default in Gradle 7+.
org.gradle.vfs.watch=true

# Limit parallel workers on memory-constrained CI agents.
# Defaults to number of CPU cores when not set.
# Override per-job in CI via: GRADLE_OPTS="-Dorg.gradle.workers.max=4"
# org.gradle.workers.max=4

# Isolated Projects (experimental): each subproject's configuration is isolated,
# enabling further parallelism beyond configuration-cache.
# Prerequisite: remove or migrate the subprojects{} block in build.gradle.kts,
# as cross-project access is forbidden under isolated projects.
# org.gradle.unsafe.isolated-projects=true


# =============================================================================
# Kotlin
# =============================================================================

# Enforce official Kotlin coding conventions across the codebase.
kotlin.code.style=official

# Enable incremental Kotlin compilation for faster local builds.
kotlin.incremental=true

# Write Kotlin build performance reports to file.
# Reports written to: build/kotlin-build-statistics.txt
kotlin.build.report.output=file

# Compose Compiler stability configuration path.
# Lists third-party classes that are immutable but not annotated with @Stable.
# Prevents unnecessary recompositions when these types are used as Composable parameters.
kotlin.compose.stabilityConfigurationPath=config/compose/stability.conf


# =============================================================================
# Android
# =============================================================================

# Mandatory for AGP 7+: use AndroidX versions of all support libraries.
android.useAndroidX=true

# Non-transitive R classes: each module's R class contains only its own
# resources. Reduces R symbol count, speeds up compilation, prevents collisions.
android.nonTransitiveRClass=true

# Jetifier is not needed for projects targeting AndroidX natively.
# Set to true only if a dependency still ships with legacy support library imports.
android.enableJetifier=false


# =============================================================================
# Android Build Features (project-wide defaults)
# Override per module via: android { buildFeatures { resValues = true } }
# =============================================================================

# Disable resource value generation -- enable explicitly per module.
android.defaults.buildfeatures.resvalues=false

# Disable GLSL shader compilation -- enable explicitly per module.
android.defaults.buildfeatures.shaders=false


# =============================================================================
# R8 / ProGuard
# =============================================================================

# Full-mode R8 applies aggressive optimizations: class merging, argument
# removal, interface collapsing. Always validate release builds after enabling.
android.enableR8.fullMode=true


# =============================================================================
# KSP / AGP 9 Compatibility
# =============================================================================

# KSP 2.3.6+ has native AGP 9 support -- the kotlin.sourceSets conflict is resolved.
# Keeping strict mode (true = default). Previously required false as a workaround.
android.disallowKotlinSourceSets=true

# =============================================================================
# Detekt 2.0 (AGP 9 compatibility)
# =============================================================================
# Required for detekt 2.0.0-alpha with AGP 9.x. Remove once detekt adds AGP 9 support.

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

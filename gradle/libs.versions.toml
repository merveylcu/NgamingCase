[versions]

agp                     = "9.4.1"
kotlin                  = "2.4.20"
ksp                     = "2.3.12"
jvmToolchain            = "17"

detekt                  = "2.0.0-alpha.6"
composeRules            = "0.6.7"
spotless                = "8.10.3"
ktlint                  = "1.8.0"
moduleGraphAssert       = "2.9.1"

lifecycle               = "2.11.0"
activityCompose         = "1.13.0"

composeBom              = "2026.09.00"
coil                    = "3.6.3"

navigation3             = "1.2.0"

hilt                    = "2.60.1"
androidxHilt            = "1.4.0"

retrofit                = "3.0.0"
okhttp                  = "5.5.0"
kotlinxSerialization    = "1.11.0"
javaxInject             = "1"

room                    = "2.8.5"

kotlinxCoroutines       = "1.11.0"
kotlinxCollectionsImmutable = "0.5.2"

junit                   = "4.13.2"
junitExt                = "1.3.0"
androidxTestRunner      = "1.7.0"
turbine                 = "1.2.1"
mockk                   = "1.14.11"
truth                   = "1.4.5"

[libraries]

android-gradlePlugin                = { group = "com.android.tools.build",  name = "gradle",                            version.ref = "agp" }
kotlin-gradlePlugin                 = { group = "org.jetbrains.kotlin",      name = "kotlin-gradle-plugin",              version.ref = "kotlin" }
compose-gradlePlugin                = { group = "org.jetbrains.kotlin",      name = "compose-compiler-gradle-plugin",    version.ref = "kotlin" }
hilt-gradlePlugin                   = { group = "com.google.dagger",         name = "hilt-android-gradle-plugin",        version.ref = "hilt" }
ksp-gradlePlugin                    = { group = "com.google.devtools.ksp",   name = "symbol-processing-gradle-plugin",   version.ref = "ksp" }
detekt-gradlePlugin                 = { group = "dev.detekt",                name = "dev.detekt.gradle.plugin",          version.ref = "detekt" }

detekt-compose-rules                = { group = "io.nlopez.compose.rules",   name = "detekt",                            version.ref = "composeRules" }

androidx-activity-compose           = { group = "androidx.activity",         name = "activity-compose",                  version.ref = "activityCompose" }

androidx-lifecycle-runtime-ktx          = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",          version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose      = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",      version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose    = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose",    version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }

androidx-compose-bom                = { group = "androidx.compose",          name = "compose-bom",                       version.ref = "composeBom" }
androidx-compose-ui                 = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics        = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling         = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
androidx-compose-material3          = { group = "androidx.compose.material3", name = "material3" }
coil-compose                        = { group = "io.coil-kt.coil3",          name = "coil-compose",                      version.ref = "coil" }
coil-network-okhttp                 = { group = "io.coil-kt.coil3",          name = "coil-network-okhttp",               version.ref = "coil" }

navigation3-runtime                 = { group = "androidx.navigation3",       name = "navigation3-runtime",               version.ref = "navigation3" }
navigation3-ui                      = { group = "androidx.navigation3",       name = "navigation3-ui",                    version.ref = "navigation3" }

hilt-android                        = { group = "com.google.dagger",          name = "hilt-android",                     version.ref = "hilt" }
hilt-android-compiler               = { group = "com.google.dagger",          name = "hilt-android-compiler",            version.ref = "hilt" }
hilt-lifecycle-viewmodel-compose    = { group = "androidx.hilt",              name = "hilt-lifecycle-viewmodel-compose", version.ref = "androidxHilt" }

retrofit                                = { group = "com.squareup.retrofit2",  name = "retrofit",                                      version.ref = "retrofit" }
retrofit-converter-kotlinx-serialization = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization",              version.ref = "retrofit" }
okhttp                                  = { group = "com.squareup.okhttp3",    name = "okhttp",                                        version.ref = "okhttp" }
okhttp-logging-interceptor              = { group = "com.squareup.okhttp3",    name = "logging-interceptor",                           version.ref = "okhttp" }
kotlinx-serialization-core              = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-core",                    version.ref = "kotlinxSerialization" }
kotlinx-serialization-json              = { group = "org.jetbrains.kotlinx",   name = "kotlinx-serialization-json",                    version.ref = "kotlinxSerialization" }
javax-inject                            = { group = "javax.inject",             name = "javax.inject",                                  version.ref = "javaxInject" }

androidx-room-runtime               = { group = "androidx.room",      name = "room-runtime",          version.ref = "room" }
androidx-room-ktx                   = { group = "androidx.room",      name = "room-ktx",              version.ref = "room" }
androidx-room-compiler              = { group = "androidx.room",      name = "room-compiler",         version.ref = "room" }

kotlinx-coroutines-android          = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-android",        version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-core             = { group = "org.jetbrains.kotlinx",     name = "kotlinx-coroutines-core",           version.ref = "kotlinxCoroutines" }
kotlinx-collections-immutable       = { group = "org.jetbrains.kotlinx",     name = "kotlinx-collections-immutable",     version.ref = "kotlinxCollectionsImmutable" }

junit                               = { group = "junit",                      name = "junit",                             version.ref = "junit" }
androidx-junit                      = { group = "androidx.test.ext",          name = "junit",                             version.ref = "junitExt" }
androidx-test-runner                = { group = "androidx.test",              name = "runner",                            version.ref = "androidxTestRunner" }
androidx-compose-ui-test-junit4     = { group = "androidx.compose.ui",        name = "ui-test-junit4" }
androidx-compose-ui-test-manifest   = { group = "androidx.compose.ui",        name = "ui-test-manifest" }
kotlinx-coroutines-test             = { group = "org.jetbrains.kotlinx",      name = "kotlinx-coroutines-test",           version.ref = "kotlinxCoroutines" }
turbine                             = { group = "app.cash.turbine",           name = "turbine",                           version.ref = "turbine" }
mockk                               = { group = "io.mockk",                   name = "mockk",                             version.ref = "mockk" }
truth                               = { group = "com.google.truth",           name = "truth",                             version.ref = "truth" }

[bundles]

compose     = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-material3",
]

lifecycle   = [
    "androidx-lifecycle-runtime-ktx",
    "androidx-lifecycle-runtime-compose",
    "androidx-lifecycle-viewmodel-compose",
]

network     = [
    "retrofit",
    "retrofit-converter-kotlinx-serialization",
    "okhttp",
    "okhttp-logging-interceptor",
    "kotlinx-serialization-json",
]

coroutines  = [
    "kotlinx-coroutines-android",
    "kotlinx-coroutines-core",
]

coil        = [
    "coil-compose",
    "coil-network-okhttp",
]

[plugins]

android-application         = { id = "com.android.application",                         version.ref = "agp" }
android-library             = { id = "com.android.library",                             version.ref = "agp" }

kotlin-compose              = { id = "org.jetbrains.kotlin.plugin.compose",             version.ref = "kotlin" }
kotlin-jvm                  = { id = "org.jetbrains.kotlin.jvm",                        version.ref = "kotlin" }
kotlin-serialization        = { id = "org.jetbrains.kotlin.plugin.serialization",       version.ref = "kotlin" }

ksp                         = { id = "com.google.devtools.ksp",                         version.ref = "ksp" }
hilt-android                = { id = "com.google.dagger.hilt.android",                  version.ref = "hilt" }

detekt                      = { id = "dev.detekt",                                       version.ref = "detekt" }
spotless                    = { id = "com.diffplug.spotless",                            version.ref = "spotless" }
module-graph-assert         = { id = "com.jraska.module.graph.assertion",               version.ref = "moduleGraphAssert" }

ngamingcase-android-application       = { id = "ngamingcase.android.application",           version = "unspecified" }
ngamingcase-android-library           = { id = "ngamingcase.android.library",               version = "unspecified" }
ngamingcase-android-library-compose   = { id = "ngamingcase.android.library.compose",      version = "unspecified" }
ngamingcase-kotlin-library            = { id = "ngamingcase.kotlin.library",                version = "unspecified" }
ngamingcase-android-hilt              = { id = "ngamingcase.android.hilt",                  version = "unspecified" }
ngamingcase-android-versioning        = { id = "ngamingcase.android.versioning",            version = "unspecified" }
ngamingcase-kotlin-lint               = { id = "ngamingcase.kotlin.lint",                   version = "unspecified" }
ngamingcase-testing                   = { id = "ngamingcase.testing",                       version = "unspecified" }

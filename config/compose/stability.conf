# Compose Compiler Stability Configuration
# https://developer.android.com/develop/ui/compose/performance/stability/fix#configuration-file
#
# List third-party classes that are immutable but not annotated with @Stable/@Immutable.
# The Compose compiler will treat these as stable, avoiding unnecessary recompositions
# when they are used as Composable parameters.
#
# Format: fully qualified class name (supports wildcards with *)

# Java time — immutable value types safe to treat as stable
java.time.LocalDate
java.time.LocalDateTime
java.time.LocalTime
java.time.ZonedDateTime
java.time.Instant

# Kotlin immutable collections (kotlinx-collections-immutable)
kotlinx.collections.immutable.ImmutableList
kotlinx.collections.immutable.ImmutableMap
kotlinx.collections.immutable.ImmutableSet
kotlinx.collections.immutable.PersistentList
kotlinx.collections.immutable.PersistentMap
kotlinx.collections.immutable.PersistentSet

# Domain models live in pure Kotlin (JVM) modules without the Compose runtime,
# so they cannot be annotated with @Immutable. They are immutable data classes.
com.merveylcu.ngamingcase.feature.posts.domain.model.*
